<title>ゴジュンワールド</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* Layout: one-column game shell. Map screen = overworld strip + island map + stage panel; play screen = chat log + puzzle board. */
:root{
  --bg:#e8efe4; --surface:#fbfbf6; --surface-2:#f0f4ea; --ink:#2c3833; --ink-soft:#5d6b65; --line:#cfd8cc; --outline:#2c3833;
  --sea:#a0c7cf; --sea-wave:#c6e0e4; --grass:#a6cb87; --grass-edge:#7aa062; --hill:#88b872; --hill-dark:#5f8d51; --trunk:#9b7653;
  --path:#f0deb0; --path-edge:#c3a76c; --node:#f2c95f; --node-done:#e47f63; --node-lock:#c3c9c0; --castle:#ddd5c6; --cloud:#ffffff; --cheek:#f0a796; --star:#f2c95f; --star-off:#d5dbd0; --heart:#e0564f; --rock-dark:#86826f; --rock:#a8a397; --sky:#bfdbe6; --meadow:#cfd88a; --meadow-edge:#a3ad5f; --sand:#efdcaa; --sand-edge:#cdb377; --palm:#6fa35d; --wood:#a07a55; --forest-bg:#9fbf9a; --forest:#86b373; --forest-edge:#557f49; --spot:#fbfbf6;
  --S:#6496cc; --V:#e47f63; --O:#74b072; --C:#e9b44c; --M:#a28fcf; --N:#5fa8a0; --J:#d58fb4; --A:#c0925f; --W:#cf5a7a; --on-role:#1e2824;
  --good:#4f9c62; --good-bg:#e1f0df; --bad:#cf5c55; --bad-bg:#f8e3df; --info-bg:#eef0f8;
  --f-jp:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  --f-en:'Fredoka','M PLUS Rounded 1c','Arial Rounded MT Bold',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b2528; --surface:#253238; --surface-2:#2b3940; --ink:#eef3ea; --ink-soft:#a7b6b0; --line:#3c4c52; --outline:#0f1719;
  --sea:#1f4250; --sea-wave:#2d5a6a; --grass:#4d7445; --grass-edge:#34522f; --hill:#436b3b; --hill-dark:#2f4d2a; --trunk:#6b5440;
  --path:#8f8059; --path-edge:#6b5f42; --node:#e4bb52; --node-done:#d9745a; --node-lock:#55615e; --castle:#8a8376; --cloud:#3a4b58; --cheek:#c9867a; --star:#e4bb52; --star-off:#46545a; --heart:#ef6b64; --rock-dark:#45423b; --rock:#5b5850; --sky:#1e3546; --meadow:#6b7340; --meadow-edge:#4c522c; --sand:#8b7b55; --sand-edge:#6a5c3d; --palm:#3f6a38; --wood:#6b5440; --forest-bg:#1d3326; --forest:#3c5f35; --forest-edge:#28421f; --spot:#d8d4c8;
  --S:#7eaadc; --V:#ec8f75; --O:#88c286; --C:#ebbf5c; --M:#b2a1dc; --N:#74bdb5; --J:#e3a3c6; --A:#d4aa7a; --W:#e07a95; --on-role:#16201c;
  --good:#6cbd7f; --good-bg:#24392c; --bad:#e57a72; --bad-bg:#3d2826; --info-bg:#2a3347;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1b2528; --surface:#253238; --surface-2:#2b3940; --ink:#eef3ea; --ink-soft:#a7b6b0; --line:#3c4c52; --outline:#0f1719;
  --sea:#1f4250; --sea-wave:#2d5a6a; --grass:#4d7445; --grass-edge:#34522f; --hill:#436b3b; --hill-dark:#2f4d2a; --trunk:#6b5440;
  --path:#8f8059; --path-edge:#6b5f42; --node:#e4bb52; --node-done:#d9745a; --node-lock:#55615e; --castle:#8a8376; --cloud:#3a4b58; --cheek:#c9867a; --star:#e4bb52; --star-off:#46545a; --heart:#ef6b64; --rock-dark:#45423b; --rock:#5b5850; --sky:#1e3546; --meadow:#6b7340; --meadow-edge:#4c522c; --sand:#8b7b55; --sand-edge:#6a5c3d; --palm:#3f6a38; --wood:#6b5440; --forest-bg:#1d3326; --forest:#3c5f35; --forest-edge:#28421f; --spot:#d8d4c8;
  --S:#7eaadc; --V:#ec8f75; --O:#88c286; --C:#ebbf5c; --M:#b2a1dc; --N:#74bdb5; --J:#e3a3c6; --A:#d4aa7a; --W:#e07a95; --on-role:#16201c;
  --good:#6cbd7f; --good-bg:#24392c; --bad:#e57a72; --bad-bg:#3d2826; --info-bg:#2a3347;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-jp);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--S);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.en{font-family:var(--f-en);font-weight:600;letter-spacing:.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* chunky buttons */
.btn{border:2px solid var(--outline);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700;box-shadow:0 3px 0 var(--outline);display:inline-flex;align-items:center;gap:6px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
.btn.primary{background:var(--V);color:var(--on-role)}
.btn.go{background:var(--O);color:var(--on-role)}
.btn.ghosty{background:transparent;box-shadow:none;border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.icon-btn{border:2px solid var(--outline);background:var(--surface);border-radius:50%;width:38px;height:38px;display:inline-grid;place-items:center;box-shadow:0 3px 0 var(--outline);padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.25rem;letter-spacing:.02em;margin-right:auto}
.logo svg{width:34px;height:38px;flex:none}
.menu-btn{display:none}
.topmenu{display:contents}
.ml{display:none}
.topbar > *{flex:none;white-space:nowrap}
.topbar > .logo{flex:0 1 auto}
@media (min-width:880px){
  .topbar{flex-wrap:nowrap;gap:8px}
  .logo{font-size:1.1rem;gap:6px;min-width:0}
}
/* narrower than one line of tools: the tools go in a menu */
@media (max-width:879px){
  .topbar{position:relative;flex-wrap:nowrap;gap:6px}
  .logo{min-width:0}
  .menu-btn{display:inline-grid;flex:none}
  .topmenu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:25;min-width:210px;flex-direction:column;align-items:stretch;gap:8px;padding:10px;background:var(--surface);border:2px solid var(--outline);border-radius:16px;box-shadow:0 5px 0 var(--outline)}
  .topmenu.open{display:flex}
  .topmenu .icon-btn{width:auto;height:44px;border-radius:12px;display:flex;justify-content:flex-start;gap:10px;padding:0 12px;box-shadow:none;color:var(--ink)}
  .topmenu .icon-btn[hidden]{display:none}
  .topmenu .qbtn{background:var(--surface)}
  .topmenu .qbtn b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--C);color:var(--on-role)}
  .topmenu .ml{display:inline;font-family:inherit;font-size:.95rem;font-weight:700}
  .topmenu .seg{align-self:stretch;display:flex}
  .topmenu .seg[hidden]{display:none}
  .topmenu .seg button{flex:1}
}
@media (max-width:560px){
  .topbar .logo{font-size:.88rem;gap:4px}
  .topbar .starpill{padding:3px 9px 3px 5px}
  .topbar .mission-pill{padding:3px 8px}
  .topbar .logo svg{width:26px;height:30px}
  .topbar .logo small{display:none}
  .topbar .starpill span,.topbar .starpill .tbar,.topbar .starpill small{display:none}
  /* the world buttons live in the menu */
  #worlds{display:none}
  /* the world name opens the reel */
  .whead .wtitle-btn{pointer-events:auto;cursor:pointer}
  .wtitle-btn .wcaret{display:inline-grid}
}
.logo small{display:block;font-size:.68rem;font-weight:700;color:var(--ink-soft);letter-spacing:.08em;margin-top:-4px}
.seg{display:inline-flex;border:2px solid var(--outline);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 var(--outline);background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:700;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--C);color:var(--on-role)}
#set-theme{flex-shrink:0}
#set-theme button{white-space:nowrap;padding:6px 10px}

/* overworld strip */
.worlds{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.wchip{flex:0 0 auto;border:2px solid var(--outline);border-radius:12px;background:var(--surface);padding:6px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 var(--outline);text-align:left}
.wchip b{font-family:var(--f-en);font-size:1.1rem;line-height:1;width:26px;height:26px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:var(--node);color:var(--on-role);border:2px solid var(--outline)}
.wchip span{font-size:.72rem;line-height:1.3;color:var(--ink-soft)}
.wchip span strong{display:block;color:var(--ink);font-size:.82rem}
.wchip[aria-current="true"]{background:var(--good-bg)}
.wchip.locked{opacity:.55;box-shadow:none;border-style:dashed;cursor:default}
.wchip.locked b{background:var(--node-lock)}
/* other worlds: just the round number token, no card behind it */
.wchip.mini{padding:0;border:0;background:transparent;box-shadow:none;border-radius:50%;align-self:center}
.wchip.mini b{width:34px;height:34px;box-shadow:0 3px 0 var(--outline)}
.wchip.mini:active b{transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
.wchip.mini.locked b{border-style:dashed;box-shadow:none}
.worlds{align-items:center}

.wtitle-btn{all:unset;pointer-events:none;display:inline-flex;align-items:center;gap:6px}
.wtitle-btn:focus-visible{outline:3px solid var(--C);outline-offset:3px;border-radius:8px}
.wcaret{display:none;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--outline);background:var(--surface);font-size:.8rem;box-shadow:0 2px 0 var(--outline)}
.wreel{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:24;height:260px;overflow:hidden;background:var(--surface);border:2px solid var(--outline);border-radius:16px;box-shadow:0 5px 0 var(--outline)}
.wreel[hidden]{display:none}
.wreel-band{position:absolute;left:6px;right:6px;top:calc(50% - 26px);height:52px;border-radius:12px;background:color-mix(in srgb,var(--C) 22%,transparent);border:2px solid var(--C);pointer-events:none}
.wreel-list{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;padding:104px 8px;box-sizing:border-box;scrollbar-width:none}
.wreel-list::-webkit-scrollbar{display:none}
.wr-item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 10px;scroll-snap-align:center;cursor:pointer;transition:opacity .15s,transform .15s}
.wr-item b{font-family:var(--f-en);width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--node);color:var(--on-role);border:2px solid var(--outline)}
.wr-item span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.wr-item strong{font-size:.95rem;color:var(--ink)}
.wr-item small{font-size:.72rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr-item.locked{cursor:default}
.wr-item.locked b{background:var(--node-lock);border-style:dashed}
.wr-item.locked strong{color:var(--ink-soft)}
.wr-item[aria-selected="true"] b{background:var(--C)}
.whead{position:relative;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.whead h1{font-size:1.35rem;margin:0;font-weight:800;text-wrap:balance}
.whead .tag{font-size:.8rem;font-weight:700;background:var(--surface);border:2px solid var(--outline);border-radius:999px;padding:1px 10px}

/* map */
.mapbox{border:3px solid var(--outline);border-radius:20px;overflow:hidden;background:var(--sea);box-shadow:0 5px 0 var(--outline)}
.mapbox svg{display:block;width:100%;height:auto;max-width:100%}
.node{cursor:pointer}
.node.locked{cursor:not-allowed}
.node:focus{outline:none}
.node:focus-visible .node-ring{stroke:var(--S);stroke-width:5}
.hero{transition:transform .55s cubic-bezier(.4,1.4,.6,1)}
.hero-bob{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.25}}
.bob2{animation:bob 3.2s ease-in-out infinite}
.cloud{animation:drift 38s linear infinite}
.cloud.c2{animation-duration:52s;animation-delay:-20s}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(900px)}}

/* stage panel */
.stagepanel{margin-top:16px;background:var(--surface);border:2px solid var(--outline);border-radius:var(--r);box-shadow:0 4px 0 var(--outline);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.stagepanel h2{margin:0;font-size:1.15rem;text-wrap:balance}
.stagepanel p{margin:2px 0 0;color:var(--ink-soft);font-size:.9rem;max-width:56ch}
.lvbadge{display:inline-flex;align-items:center;gap:3px;font-family:inherit;font-weight:700;font-size:.78rem;background:var(--C);color:var(--on-role);border:2px solid var(--outline);border-radius:8px;padding:0 8px;margin-right:6px;vertical-align:2px}
.lvbadge.boss{background:var(--V)}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:20px;height:20px}
.sp-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:.85rem;color:var(--ink-soft)}
@media (max-width:560px){.stagepanel{grid-template-columns:1fr}.stagepanel .btn{justify-self:start}
  .mapbox{overflow-x:auto}.mapbox svg{width:640px;max-width:none}
  .task{padding:12px 10px 14px}.board{padding:8px;gap:8px}.slot-h .nm{display:none}}

.rdot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-family:var(--f-en);font-weight:700;font-size:.8rem;color:var(--on-role);border:2px solid var(--outline)}

/* role colors */
.r-S{--rc:var(--S)} .r-V{--rc:var(--V)} .r-O{--rc:var(--O)} .r-C{--rc:var(--C)} .r-M{--rc:var(--M)} .r-N{--rc:var(--N)} .r-J{--rc:var(--J)} .r-A{--rc:var(--A)} .r-W{--rc:var(--W)}
.rdot,.rtag{background:var(--rc)}
.rtag{display:inline-block;font-family:var(--f-en);font-weight:700;color:var(--on-role);border-radius:6px;padding:0 6px;font-size:.85em;border:1.5px solid var(--outline)}

/* play screen */
.playbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.playbar h2{margin:0;font-size:1.05rem;margin-right:auto;min-width:0}
.pill{border:2px solid var(--outline);border-radius:999px;background:var(--surface);padding:2px 10px;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.timer.over{background:var(--bad-bg)}
.progress{display:flex;gap:4px}
.progress i{width:12px;height:12px;border-radius:50%;border:2px solid var(--outline);background:var(--surface)}
.progress i.done{background:var(--O)}
.progress i.now{background:var(--C)}

.chat{background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r);padding:10px;max-height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.ava{flex:0 0 32px;width:32px;height:32px;border-radius:50%;border:2px solid var(--outline);display:grid;place-items:center;font-family:var(--f-en);font-weight:700;background:var(--S);color:var(--on-role)}
.ava svg{width:26px;height:28px}
.msg.me .ava{background:var(--surface)}
.bub{background:var(--surface);border:2px solid var(--outline);border-radius:14px 14px 14px 4px;padding:5px 11px;min-width:0}
.msg.me .bub{background:var(--good-bg);border-radius:14px 14px 4px 14px}
.bub .en{display:block;font-size:1rem}
.bub small{display:block;color:var(--ink-soft);font-size:.75rem;line-height:1.35}
.bub.typing{font-family:var(--f-en);letter-spacing:.2em;color:var(--ink-soft)}

.task{background:var(--surface);border:2px solid var(--outline);border-radius:18px;box-shadow:0 4px 0 var(--outline);padding:14px 14px 16px;display:flex;flex-direction:column;gap:14px}
.inst{font-weight:700;font-size:.95rem}
.inst .sub{display:block;font-weight:400;font-size:.8rem;color:var(--ink-soft)}
.jasrc{font-size:.85rem;color:var(--ink-soft)}
.jabig{font-size:1.35rem;font-weight:700;line-height:1.7;letter-spacing:.02em}
.jabig .seg-j{border-radius:6px;padding:1px 2px;transition:background .15s}
.jabig .seg-j.tap{cursor:pointer;border-bottom:3px dotted var(--line)}
.jabig .seg-j.tap:hover{background:var(--surface-2)}
.jabig .seg-j.found{background:var(--rc);color:var(--on-role);border-bottom:0;padding:1px 6px;margin:0 2px}
.jabig .seg-j.eqsign{display:inline-block;padding:1px 10px;margin:0 6px;font-family:var(--f-en);animation:eqIn .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes eqIn{from{transform:scale(.4)}}
@media (prefers-reduced-motion:reduce){.jabig .seg-j.eqsign{animation:none}}
.jastrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:42px}
.jachip{border:2px solid var(--outline);border-radius:10px;padding:4px 10px;font-weight:700;background:var(--surface);box-shadow:0 3px 0 var(--outline);font-size:1rem}
.jachip.colored{background:var(--rc);color:var(--on-role)}
.jachip.static{box-shadow:none}
.jachip.used{visibility:hidden}
.jasep{color:var(--ink-soft);font-weight:800}
.jaslot{border:2px dashed var(--line);border-radius:10px;min-width:56px;height:38px}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px;border-top:2px dashed var(--line)}

.palette{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--ink-soft)}
.palbtn{border:2px solid var(--outline);border-radius:10px;padding:2px 10px;background:var(--rc);color:var(--on-role);font-family:var(--f-en);font-weight:700;box-shadow:0 3px 0 var(--outline);display:inline-flex;gap:6px;align-items:baseline}
.palbtn small{font-family:var(--f-jp);font-size:.72rem}

.board{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;padding:12px;border-radius:14px;background:var(--surface-2);min-height:112px}
.board .empty-note{color:var(--ink-soft);font-size:.85rem;align-self:center}
.slot{position:relative;flex:1 1 84px;max-width:220px;min-width:72px;border:3px solid var(--rc);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;cursor:pointer;transition:transform .12s}
.slot.flex{border-style:dashed}
/* the box the next card goes into: dark pulsing ring, lifted, tinted, with a tag */
.slot.focus{transform:translateY(-3px);box-shadow:0 0 0 3px var(--surface-2),0 0 0 7px var(--ink);animation:focusPulse 1.1s ease-in-out infinite}
.slot.focus .slot-b{background:color-mix(in srgb,var(--rc) 22%,var(--surface))}
@keyframes focusPulse{50%{box-shadow:0 0 0 3px var(--surface-2),0 0 0 7px var(--ink),0 0 0 14px color-mix(in srgb,var(--ink) 25%,transparent)}}
.board.cards .slot.focus::after{content:"▼ ここに入る";position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.68rem;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap;z-index:2}
.board.cards{padding-top:18px}
.slot-h{background:var(--rc);color:var(--on-role);font-size:.72rem;font-weight:700;padding:1px 8px;display:flex;gap:6px;align-items:baseline;border-radius:8px 8px 0 0}
.slot.flex .slot-h{background:transparent;color:var(--ink);border-bottom:2px dashed var(--rc)}
.slot-h b{font-family:var(--f-en);font-size:.95rem}
.slot-b{flex:1;display:grid;place-items:center;padding:8px 6px;min-height:46px}
.slot-b .placed{font-family:var(--f-en);font-weight:600;font-size:1.2rem;text-align:center;animation:pop .22s ease-out}
.slot-b .hole{width:60%;height:4px;border-radius:2px;background:var(--line)}

.jw{display:inline-block}
@supports (word-break:auto-phrase){[lang=ja],.jwrap{word-break:auto-phrase}}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:.8rem}
.goalbox{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:12px;margin:4px 0 10px}
.g-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.92rem}
.g-row b{font-size:1rem}
.g-tag{flex:0 0 auto;font-size:.72rem;font-weight:800;border:2px solid var(--outline);border-radius:999px;padding:0 8px;background:var(--C);color:var(--on-role)}
.g-tag.skill{background:var(--S)}
.g-tag.can{background:var(--O)}
.example{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.exbox{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:2.5px solid var(--rc);border-radius:10px;background:var(--surface);padding:2px 10px 4px;min-width:52px}
.exbox.flex{border-style:dashed}
.exbox b{font-family:var(--f-en);font-size:.7rem;background:var(--rc);color:var(--on-role);border-radius:5px;padding:0 5px;align-self:flex-start;margin-left:-4px}
.exbox .en{font-size:1.02rem}
.exbox small{font-size:.68rem;color:var(--ink-soft);line-height:1.2}
.example .nest{flex:0 1 auto;padding:22px 6px 6px;gap:6px}
.example .mini{align-self:center}
.sp-goal{margin:6px 0 0;font-size:.9rem;max-width:60ch}
.sp-goal .g-tag{margin-right:6px}
.card.guide{background:var(--rc);color:var(--on-role);border-color:var(--outline);box-shadow:0 0 0 4px color-mix(in srgb,var(--rc) 45%,transparent);animation:guidePulse 1.1s ease-in-out infinite}
@keyframes guidePulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--rc) 25%,transparent)}}
.tray.guiding .card:not(.guide){opacity:.4}
@media (prefers-reduced-motion:reduce){.card.guide{animation:none}}
.drill-fill{gap:3px;align-items:flex-end}
.drill-fill-top{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;letter-spacing:0}
.drill-fill-top .dch{display:inline-grid;place-items:center;min-width:14px;font-family:var(--f-en);font-size:1.15rem;font-weight:700;color:var(--ink-soft)}
.drill-fill-top .dch.done{color:var(--O)}
.drill-fill-top .dch.hole{color:var(--S)}
.dslot.typed{color:#fff;background:var(--O);border-color:var(--O);border-radius:6px 6px 0 0}
.drill-fill .dch{display:inline-grid;place-items:center;height:30px;min-width:14px;font-family:var(--f-en);font-size:1.15rem;font-weight:700;color:var(--ink)}
.drill-fill .dgap{display:inline-block;width:14px}
.dslot.cur{border-color:var(--S);background:color-mix(in srgb,var(--S) 18%,transparent);border-radius:6px 6px 0 0}
.umlauts{display:flex;gap:6px;justify-content:center;margin:6px 0}
.umlauts .dtile{min-width:40px}
.skel-note{margin:0 0 4px}
.lvi{width:14px;height:14px;flex:none}
.lvbadge .lvi{margin-left:-2px}
.card.bounce{animation:cardBounce .45s ease-out}
@keyframes cardBounce{0%{transform:translateY(-14px) rotate(-6deg);border-color:var(--V)}40%{transform:translateY(0) rotate(4deg)}70%{transform:rotate(-2deg)}100%{transform:none}}
.slot.good .placed{animation:snapIn .25s ease-out}
@keyframes snapIn{0%{transform:scale(1.25)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.card.bounce,.slot.good .placed{animation:none}}
.warm-tag{display:inline-block;width:fit-content;align-self:flex-start;margin-bottom:4px}
.mastery{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700}
.mastery>span{color:var(--ink-soft)}
.mastery i{display:block;width:90px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.mastery i b{display:block;height:100%;background:var(--S)}
.mastery.mid i b{background:var(--C)}
.mastery.hi i b{background:var(--O)}
.mastery small{font-size:.72rem;color:var(--ink-soft)}
.mastery.small{display:flex;margin-top:2px}
.mastery.small i{width:70px;height:6px}
.nb-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.nb-chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--outline);border-radius:999px;padding:2px 10px 2px 3px;font-weight:700;font-size:.85rem;background:color-mix(in srgb,var(--rc) 15%,var(--surface))}
.nb-chip .rdot{width:auto;min-width:22px;padding:0 3px}
.goalcheck{margin:6px auto 10px;max-width:520px;background:var(--surface);border:2px solid var(--outline);border-radius:14px;padding:10px 14px;text-align:left;font-size:.9rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dialog .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line)}
.set-row label{font-weight:700}
.set-row small{display:block;font-weight:400;color:var(--ink-soft);font-size:.78rem}
/* the warm-up toggle in the start dialog is a card like the めあて box above it */
.set-row.vtoggle{background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.switch{appearance:none;width:48px;height:28px;border-radius:999px;border:2px solid var(--outline);background:var(--node-lock);position:relative;cursor:pointer;flex:0 0 auto}
/* track is 48x28 with a 2px border, so the inside is 44x24; the knob is 22 tall and sits 1px in */
.switch::after{content:'';box-sizing:border-box;position:absolute;top:1px;left:1px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--outline);transition:left .15s}
.switch:checked{background:var(--O)}
.switch:checked::after{left:21px}
textarea{width:100%;min-height:140px;border:2px solid var(--line);border-radius:10px;padding:8px;font-family:ui-monospace,Consolas,monospace;font-size:.75rem;background:var(--surface-2);color:var(--ink)}
.fmt{width:100%;border-collapse:collapse;font-size:.78rem;margin:8px 0}
.fmt td{border-top:1px solid var(--line);padding:4px 6px;vertical-align:top}
.fmt td:first-child{font-family:ui-monospace,Consolas,monospace;white-space:nowrap;font-weight:700}
.tablewrap{overflow-x:auto}
.msgline{font-size:.85rem;margin-top:6px;min-height:1.2em}
.msgline.err{color:var(--bad)}
.msgline.ok{color:var(--good)}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:10px}
.result h2{margin:0;font-size:1.5rem}
.bigstars{display:flex;gap:10px}
.bigstars .st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;color:var(--ink-soft);width:86px}
.bigstars svg{width:62px;height:62px}
.bigstars .on svg{animation:starpop .5s cubic-bezier(.3,1.6,.5,1) both}
.bigstars .st:nth-child(2) svg{animation-delay:.25s}
.bigstars .st:nth-child(3) svg{animation-delay:.5s}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.crownline{font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
.crownline svg{width:28px;height:22px}

.scard{width:min(320px,100%);border:3px solid var(--outline);border-radius:16px;background:var(--surface);box-shadow:0 5px 0 var(--outline);overflow:hidden;text-align:left}
.scard .top{background:var(--S);color:var(--on-role);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.scard .top span{font-family:var(--f-en);font-size:.8rem}
.scard .body{padding:10px 12px;font-size:.85rem;display:flex;flex-direction:column;gap:3px}
.scard .body .en{font-size:.92rem}
.scard.new{animation:pop .5s .7s both}

/* book */
.col-tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.col-tab{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border:2px solid var(--outline);border-radius:14px;background:var(--surface);box-shadow:0 3px 0 var(--outline);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.col-tab[aria-selected="true"]{background:var(--surface-2);box-shadow:none;transform:translateY(3px)}
.col-tab span{font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.col-tab b{font-family:var(--f-en);font-size:1.3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.col-tab b small{font-size:.75rem;color:var(--ink-soft)}
.col-tab .bar{display:block;width:100%;height:6px;margin-top:3px}
.col-tab .newdot{top:-7px;right:-7px}
.col-how{margin:4px 0 8px}
.medal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:8px}
.medal-grid span{display:flex;flex-direction:column;align-items:center;font-family:var(--f-en);font-size:.75rem;font-weight:700;padding:4px;border:2px dashed var(--line,var(--ink-soft));border-radius:10px;color:var(--ink-soft)}
.medal-grid span.got{border-style:solid;border-color:var(--outline);color:var(--ink);background:var(--surface)}
.medal-grid .medal{width:22px;height:28px}
.col-link{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:2px solid var(--outline);border-radius:14px;background:var(--surface);padding:10px 12px;margin:14px 0}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
.bookgrid .scard{width:auto}
.scard.locked{border-style:dashed;box-shadow:none;opacity:.6}
.scard.locked .top{background:var(--node-lock)}
.scard .lines{display:flex;flex-direction:column;gap:6px}
.scard .line{display:flex;gap:6px;align-items:flex-start}
.scard .line div{min-width:0}
.scard .line small{display:block;color:var(--ink-soft);font-size:.72rem}
.weakbox{margin-top:12px;background:var(--surface);border:2px solid var(--outline);border-radius:var(--r);box-shadow:0 4px 0 var(--outline);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.weakbox p{margin:0;margin-right:auto}
.sectitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sectitle h1{margin:0;font-size:1.3rem;margin-right:auto}

.cleared{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;text-align:center}
.cleared b{font-size:1.2rem}

/* phone overrides: kept last so they win over the base rules above */
@media (max-width:560px){
  .board{padding:8px;gap:6px}
  .slot{flex-basis:70px;min-width:62px}
  .slot-h{padding:1px 5px;gap:4px}
  .nest{flex-basis:100%}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- CSV ---------- */
function parseCSV(text) {

// RULE rows in the data give the rules; a world without them uses its stages' めあて
function worldRules(w) {

  return rows.map(r => ({ ...r, st: w.stages.find(s => s.num === r.stage) || null }));

// the typical beginner mistake for a check question: the words kept in Japanese order
function japaneseOrder(q) {
  const pos = [], v = variants(q.chunks)[0];
  v.forEach((i, k) => { const c = q.chunks[i], p = jaIn(c) ? q.ja.indexOf(jaIn(c)) : -1; pos[i] = p >= 0 ? p : (k ? pos[v[k - 1]] + .5 : -1); });

  const qs = st.lines.filter(l => l.type === 'Q');
  for (const q of qs.slice(nth % qs.length).concat(qs.slice(0, nth % qs.length))) {
    const v = variants(q.chunks)[0], right = modelSentence(q);
    let wrongV = japaneseOrder(q);
    if (norm(compose(wrongV.map(i => q.chunks[i].answers[0]), q)) === norm(right)) {
      // Japanese order happens to be right: show the verb in the wrong place instead
      const vi = v.findIndex(i => q.chunks[i].role === 'V' && !q.chunks[i].group);

}

/* ---------- spelling drill: card → letter tiles → fill the gaps → type it all ---------- */
// words take turns (interleaved), so each one comes back after a short gap; a typing mistake sends a word one step back
const DRILL_STEPS = ['見て聞く', 'ならべかえ', '穴うめ', 'ぜんぶ打つ'];
const drillTiles = en => en.replace(/\s+/g, '').length > 16 && en.includes(' ') ? en.split(/\s+/) : [...en.replace(/\s+/g, '')];

const NEAR_LETTERS = { a: 'äeo', ä: 'ae', o: 'öu', ö: 'oe', u: 'üo', ü: 'ui', e: 'ia', i: 'eü', s: 'ßz', ß: 'sz', b: 'pd', p: 'bq', d: 'tb', t: 'dk', g: 'kj', k: 'gc', c: 'ks', m: 'n', n: 'mh', r: 'l', l: 'r', f: 'v', v: 'fw', w: 'v', h: 'n', z: 's', y: 'i', j: 'g', x: 'k', q: 'k' };

const drillGaps = en => { const m = [...drillMask(en)], e = [...en]; return m.map((ch, i) => ch === '＿' ? i : -1).filter(i => i >= 0 && e[i]); };
// the letters to retype (punctuation and spaces fill themselves in)
const drillLetters = en => [...en].map((ch, i) => /\p{L}/u.test(ch) ? i : -1).filter(i => i >= 0);
// tiles for retyping: every letter of the word plus decoys that look or sound alike
function drillLetterTiles(en) {
  const e = [...en], need = [...new Set(drillLetters(en).map(i => e[i].toLowerCase()))];
  const ok = ch => /[a-zäöüß]/.test(ch) && (LANG === 'de' || !/[äöüß]/.test(ch));
  const set = new Set(need), max = Math.max(10, need.length + 4);
  need.forEach(ch => [...(NEAR_LETTERS[ch] || '')].filter(ok).forEach(x => { if (set.size < max) set.add(x); }));
  const abc = [...'abcdefghiklmnoprstuwz'];
  while (set.size < Math.max(8, need.length + 3)) set.add(abc[Math.floor(Math.random() * abc.length)]);

  const total = words.length * DRILL_STEPS.length;
  const unKey = () => { if (D.onKey) { document.removeEventListener('keydown', D.onKey); D.onKey = null; } };
  const finish = () => { unKey(); delete $('#dialog').dataset.locked; closeDialog(); if (onDone) onDone(); };

    D.tok = (D.tok || 0) + 1;
    const w = D.q.shift();
    if (ok) w.step++; else { w.miss++; w.step = Math.max(1, w.step - 1); }
    if (w.step >= DRILL_STEPS.length) { D.done.push(w); markVocab(w.key, 'known'); }
    else D.q.splice(Math.min(D.q.length, ok ? 2 : 1), 0, w); // come back soon, but not right away
    D.fb = null; D.placed = []; D.tiles = null; D.wrongTap = 0; D.fill = null; D.letters = null; draw();
  };

    <div class="vbar"><i style="width:${Math.round((D.done.length * DRILL_STEPS.length + D.q.reduce((a, x) => a + x.step, 0)) / total * 100)}%"></i></div>
    <div class="vmeta"><span>のこり ${D.q.length}語</span><span class="drill-steps">${DRILL_STEPS.map((s, i) => `<i class="${i < w.step ? 'on' : i === w.step ? 'cur' : ''}">${s}</i>`).join('')}</span></div>
    <div class="drill-ja r-${w.role}"><span class="vtag">${w.role} ${ROLES[w.role].name}</span><b>${esc(w.ja)}</b></div>`;

    unKey();
    const w = D.q[0];
    if (!w) {
      if (opts.onComplete && !D.counted) { D.counted = true; opts.onComplete(); }
      $('#dialog').innerHTML = `<h2>全部おぼえた！</h2>
        <div class="scene-ill"><svg aria-hidden="true"><use href="#hako"/></svg><p>${D.done.length}語を、カード → ならべかえ → 穴うめ → ぜんぶ打つ の4段階でクリア！ 「知ってる」に入れておいたよ。</p></div>
        <div class="vlist">${D.done.map(v => `<span class="vchip r-${v.role}"><b class="en">${esc(v.en)}</b><small>${esc(v.ja)}${v.miss ? `・まちがい ${v.miss}` : ''}</small></span>`).join('')}</div>
        <div class="row"><button type="button" class="btn primary" id="dr-end">${opts.doneLabel || 'とじる'}</button></div>`;
      $('#dr-end').onclick = finish; $('#dr-end').focus(); sfx('clear');
      return;
    }
    let body = '';
    if (w.step === 0) {
      body = `<div class="drill-en"><b class="en">${esc(w.en)}</b><button type="button" class="mini" data-say="${esc(w.en)}" aria-label="読み上げ">${icon('i-speaker')}</button></div>
        <p class="jasrc">見て、聞いて、声に出して言ってみよう。</p>
        <div class="row"><button type="button" class="btn primary" id="dr-ok">おぼえた！</button></div>`;
    } else if (w.step === 1) {
      if (!D.tiles) D.tiles = shuffle(drillTiles(w.en).map((t, i) => ({ t, i })));
      const target = drillTiles(w.en), byWord = target.length !== [...w.en.replace(/\s+/g, '')].length;

}

/* ---------- live letter-count hint under each typing box ---------- */
// ● typed, ○ still to type (LV3 shows the first letter), red +n when a word runs long
// the correct answer the student seems to be typing ("14 years old" as well as "fourteen"): the longest shared start wins
function hintAnswer(c, typed) {
  const alts = c.answers.filter(a => a && a !== '-'), u = norm(typed || '');
  if (!u) return alts[0];
  const lcp = a => { const n = norm(a); let i = 0; while (i < n.length && i < u.length && n[i] === u[i]) i++; return i; };
  return alts.reduce((best, a) => lcp(a) > lcp(best) ? a : best, alts[0]);
}
function liveHint(s, typed) {
  if (P.expert || s.ci == null || P.input !== 'type') return '';
  const words = decap(hintAnswer(P.q.chunks[s.ci], typed)).split(' '), tw = String(typed || '').trim().split(/\s+/).filter(Boolean);
  const first = P.lvKey !== 'BOSS';
  return words.map((w, k) => {
    const t = (tw[k] || '').length;
    let h = '';
    for (let j = 0; j < w.length; j++) h += j < t ? '<i>●</i>' : (first && j === 0 ? esc(w[0]) : '○');
    if (t > w.length) h += `<b class="over">+${t - w.length}</b>`;
    return h;
  }).join('<span class="gap"> </span>') + (tw.length > words.length ? `<b class="over"> +${tw.length - words.length}語</b>` : '');
}

/* ---------- boss hearts: three hearts in quarters, draining with the time limit ---------- */
const HEART = 'M12 21s-7.5-4.6-9.6-9.2C1 8.6 2.8 5 6.3 5c2.2 0 3.8 1.3 5.7 3.4C13.9 6.3 15.5 5 17.7 5c3.5 0 5.3 3.6 3.9 6.8C19.5 16.4 12 21 12 21z';

/* ---------- phrase flashcards before a stage ---------- */
const VOCAB_SKIP = new Set(['i', 'you', 'he', 'she', 'it', 'we', 'they', 'me', 'us', 'him', 'her', 'them', 'am', 'is', 'are', 'was', 'were', 'be', 'do', 'does', 'did', 'this', 'that', 'a', 'an', 'the', 'my', 'can', 'will', 'there is', 'there are', 'here']);
const KEEP_CAP = new Set(['English', 'Japanese', 'TV', 'T-shirt']);
if (LANG === 'de') ['ich', 'du', 'er', 'sie', 'es', 'wir', 'ihr', 'mich', 'dich', 'mir', 'dir', 'bin', 'bist', 'ist', 'sind', 'seid', 'der', 'die', 'das', 'ein', 'eine', 'und', 'nicht'].forEach(w => VOCAB_SKIP.add(w));
const DE_NAMES = /^(ken|lena|emma|tom|anna|max|yui|osaka|tokio|japan|berlin|deutschland|kyoto|hokkaido)$/i;
// the meaning on a card: a word's meaning, not the piece of the Japanese sentence it stood for
// a gloss table (data/gloss.txt) covers pieces that are not a meaning by themselves (たいです・せます・見); otherwise the piece,
// without the は/が/を that only mark its place; an M keeps its particle (in Osaka ＝ 大阪に), a verb loses the question's か
const GLOSS_RAW = @@GLOSS@@;
let CARD_GLOSS = null;
const cardGlossOf = key => { if (!CARD_GLOSS) CARD_GLOSS = Object.fromEntries(Object.entries(GLOSS_RAW).map(([k, v]) => [norm(k), v])); return CARD_GLOSS[key]; };
const cardJa = c => { const j = jaOf(c); return /^M/.test(c.role) ? j : c.role === 'V' ? j.replace(/か$/, '') : j.replace(/[はがを]$/, ''); };
function stageVocab(st) {
  if (st.level === 'SORT') return [];
  const seen = new Set(), out = [];
  st.lines.filter(l => l.type === 'Q').forEach(q => q.chunks.forEach(c => {
    if (!c.ja || !c.answers[0]) return;
    const en = decap(c.answers[0]), key = norm(en);
    if (VOCAB_SKIP.has(key) || seen.has(key)) return;
    // a card made only of a name (Ken, Emma, Mt. Fuji) teaches nothing; "in Osaka" stays for its "in"
    if (LANG === 'de' ? DE_NAMES.test(en) : en.split(/\s+/).every(w => /^[A-Z]/.test(w) && !KEEP_CAP.has(w.replace(/[^A-Za-z-]/g, '')))) return;
    const g = cardGlossOf(key); if (g === '-') return; // a separable prefix (auf, an …) is learned with its verb
    seen.add(key); out.push({ key, en, ja: g || cardJa(c), role: c.role });
  }));
  return out;
}
window.gojunCards = () => WORLDS.flatMap(w => w.stages.flatMap(s => stageVocab(s).map(v => ({ stage: s.id, en: v.en, ja: v.ja, role: v.role }))));
const vocabState = k => (save.vocab || {})[k];
const vocabDeck = st => stageVocab(st).filter(v => vocabState(v.key) !== 'known');
// the stage where each phrase first appears, so the warm-up deck can skip phrases met before
let VOCAB_FIRST = null;
function vocabFirst() {
  if (!VOCAB_FIRST) { VOCAB_FIRST = {}; WORLDS.forEach(w => w.stages.forEach(s => stageVocab(s).forEach(v => { if (!VOCAB_FIRST[v.key]) VOCAB_FIRST[v.key] = s.id; }))); }
  return VOCAB_FIRST;
}
const PRE_MAX = 8;
// warm-up deck: phrases marked 学習中, phrases new in this stage, and unmet phrases from stages not cleared yet (at most 8)
function preDeck(st) {
  const first = vocabFirst(), rank = v => vocabState(v.key) === 'learning' ? 0 : first[v.key] === st.id || !first[v.key] ? 1 : 2;
  return stageVocab(st).filter(v => { const k = vocabState(v.key); if (k === 'known') return false; if (k === 'learning') return true; const f = first[v.key]; return !f || f === st.id || !(save.stars[f] || {}).clear; })
    .sort((a, b) => rank(a) - rank(b)).slice(0, PRE_MAX);
}
// 単語道場: the phrases that first appear in a stage (the stop on the road before it)
const DOJO_MAX = 10;
const dojoWords = st => { const first = vocabFirst(); return stageVocab(st).filter(v => first[v.key] === st.id).slice(0, DOJO_MAX); };
const dojoState = st => { const ws = dojoWords(st); if (!ws.length) return null; return ws.every(v => vocabState(v.key) === 'known') ? 'done' : ws.some(v => vocabState(v.key)) ? 'seen' : 'new'; };
const typingLevel = st => ['L3', 'L4', 'BOSS'].includes(st.level);
function openDojo(st, words) {
  const counted = () => bump('dojo');
  const ws = words || (dojoWords(st).length ? dojoWords(st) : stageVocab(st));
  const left = ws.filter(v => vocabState(v.key) !== 'known');
  const back = () => { if (!$('#scr-map').hidden) renderMap(); };
  const mark = k => vocabState(k) === 'known' ? '<i class="dk">✓</i>' : '';
  openDialog(`<div class="dojo-head"><svg viewBox="0 0 30 36" aria-hidden="true"><use href="#sensei"/></svg><div><h2>単語道場</h2>
      <p>${words ? `プレイ中につまずいた単語 ${ws.length}語。ここで覚えちゃおう！`
        : `${st.world}-${st.num}「${esc(st.title)}」で${dojoWords(st).length ? `新しく出る単語 ${ws.length}語` : '使う単語'}。${typingLevel(st) ? 'このステージは英語を打つから、つづりまで覚えておくと安心！' : ''}`}</p></div></div>
    <div class="vlist">${ws.map(v => `<span class="vchip r-${v.role}"><b class="en">${esc(v.en)}${mark(v.key)}</b><small>${esc(v.ja)}</small></span>`).join('')}</div>

const CATS = {

function catOf(m) {
  if (/疑問/.test(m)) return 'question';
  if (/原形/.test(m)) return 'modal';
  if (/比較級|最上級/.test(m)) return 'comp';
  if (/受け身/.test(m)) return 'passive';
  if (/現在完了/.test(m)) return 'perfect';
  if (/There is|There are/.test(m)) return 'there';
  if (/形だけの主語|It を使う/.test(m)) return 'it';
  if (/who|which/.test(m)) return 'rel';
  if (/because|when|if/.test(m)) return 'conj';
  if (/to＋動詞|〜ing/.test(m)) return 'verbal';
  if (/過去/.test(m)) return 'past';
  if (/be動詞|was、/.test(m)) return 'be';
  if (/3人称|s をつけ|s はつけない/.test(m)) return 's';
  if (/me \/ us/.test(m)) return 'pron';
  if (/a \/ the|a をつけない|ひっかけ/.test(m)) return 'art';
  if (/かたまり|うしろから/.test(m)) return 'nest';
  if (/すぐ後ろ|語順|順番|位置|から始|最初|後ろのほう|箱が足りない|箱が多すぎ|箱がない|仲間/.test(m)) return 'order';
  return 'word';
}

function coachRect(st) {
  const rs = [].concat(st.el).map(sel => document.querySelector(sel)).filter(Boolean).map(e => e.getBoundingClientRect());
  if (!rs.length) return null;
  const left = Math.min(...rs.map(r => r.left)), top = Math.min(...rs.map(r => r.top));
  const right = Math.max(...rs.map(r => r.right)), bottom = Math.max(...rs.map(r => r.bottom));
  return { left, top, right, bottom, width: right - left, height: bottom - top };
}
FEATURES.forEach(f => { TUTORIALS['feat-' + f.id] = [{ el: f.el, optional: true, text: `<b>NEW！${f.name}</b><br>${f.desc}` }]; });
const COACH = { key: null, step: 0, queue: [], tick: null, pausedAt: 0, shown: -1, force: false, qid: null, doneTimer: null };
const coachSeen = k => !!(save.tutorials || {})[k];
function coachStart(key, force) {
  if (!TUTORIALS[key] || (!force && (save.tutorialsOff || coachSeen(key)))) return;
  if (force && !COACH.key) COACH.force = true;
  if (COACH.key) { if (COACH.key !== key && !COACH.queue.includes(key)) COACH.queue.push(key); return; }
  COACH.key = key; COACH.step = 0; COACH.shown = -1; COACH.qid = P && P.q ? P.q.id : null;
  if (P && P.timer && !P.ended) COACH.pausedAt = Date.now(); // tutorial time does not count against the target time
  clearInterval(COACH.tick); COACH.tick = setInterval(coachTick, 250);
  coachTick();
}
function coachEnd(markSeen) {
  if (COACH.key && markSeen) { save.tutorials = { ...(save.tutorials || {}), [COACH.key]: true }; persist(); }
  if (COACH.pausedAt && P) P.t0 += Date.now() - COACH.pausedAt;
  COACH.pausedAt = 0; COACH.key = null; COACH.finishing = false; clearInterval(COACH.tick); clearTimeout(COACH.doneTimer); COACH.doneTimer = null;
  const box = $('#coach'); box.hidden = true; box.innerHTML = '';
  menuOpen(false);
  document.querySelectorAll('.tray.guiding, .card.guide').forEach(e => e.classList.remove('guiding', 'guide'));
  const next = COACH.queue.shift();
  if (next && markSeen) coachStart(next, COACH.force); else { COACH.queue = []; COACH.force = false; }
}
function coachTick() {
  if (!COACH.key || COACH.finishing) return;

  let st = steps[COACH.step];
  // optional steps whose target is missing are skipped; a waiting step advances once the student has done it
  while (st && ((st.optional && ![].concat(st.el).every(sel => document.querySelector(sel))) || (st.skipIf && st.skipIf()))) st = steps[++COACH.step];
  if (st && st.wait && COACH.shown === COACH.step && st.wait()) st = steps[++COACH.step];
  while (st && ((st.optional && ![].concat(st.el).every(sel => document.querySelector(sel))) || (st.skipIf && st.skipIf()))) st = steps[++COACH.step];
  if (!st) return coachEnd(true);
  // the student moved on to another question: this tutorial is over
  if (P && COACH.qid && P.q && P.q.id !== COACH.qid) return coachEnd(true);
  // answered correctly: explanation steps close by themselves (the result explanation stays a moment)
  if (P && P.phase === 'done' && !st.wait) {
    if (![].concat(st.el).includes('#fb')) return coachFinish();
    if (!COACH.doneTimer) COACH.doneTimer = setTimeout(() => { COACH.doneTimer = null; coachFinish(); }, 3500);
  }
  if (!$('#overlay').hidden) { $('#coach').hidden = true; return; }
  if (COACH.shown !== COACH.step) coachDraw(st, steps);
  applyGuide();
  const r = coachRect(st);
  coachPlace(r);
  // a scroll that was cut short or overtaken left the lit area off screen: jump to it
  if (r && r.height && (r.bottom < 0 || r.top > innerHeight) && Date.now() - (COACH.scrolledAt || 0) > 900) coachScroll(r, 'auto');
}
function coachFinish() {
  if (!COACH.key || COACH.finishing) return;
  const steps = TUTORIALS[COACH.key], b = $('#coach-bubble');
  if (!b || $('#coach').hidden || COACH.shown === steps.length - 1) return coachEnd(true);
  COACH.finishing = true; clearInterval(COACH.tick);
  const c = b.querySelector('.coach-count'); if (c) c.textContent = '✓ おわり！';
  b.querySelectorAll('#coach-skip, #coach-next, .coach-do').forEach(x => x.remove());
  b.classList.add('finished');
  setTimeout(() => { if (COACH.key) coachEnd(true); }, 1500);
}
function coachInteract(e) {
  if (!COACH.key || COACH.shown !== COACH.step || e.target.closest('#coach, #overlay')) return;
  const st = TUTORIALS[COACH.key][COACH.step];
  if (!st || st.wait) return;
  if (!e.target.closest('#task, #board, .tray, #mapbox, #stagepanel, .worlds')) return;
  // skip past the remaining explanation bubbles up to the next step that waits for an action
  setTimeout(() => {
    const steps = TUTORIALS[COACH.key || ''] || []; if (steps[COACH.step] !== st) return;
    let k = COACH.step + 1; while (steps[k] && !steps[k].wait) k++;
    if (!steps[k]) return coachFinish();
    COACH.step = k; coachTick();
  }, 0);
}
document.addEventListener('pointerdown', coachInteract, true);
document.addEventListener('keydown', e => { if (e.target.closest && e.target.closest('#task')) coachInteract(e); }, true);
function coachDraw(st, steps) {
  const last = COACH.step === steps.length - 1;
  const box = $('#coach'); box.hidden = false;
  box.innerHTML = `<div class="coach-hole" id="coach-hole"></div>
    <div class="coach-bubble" id="coach-bubble" role="dialog" aria-label="チュートリアル">
      <svg class="coach-face" aria-hidden="true"><use href="#hako"/></svg>

        <div class="coach-row"><span class="coach-count">${COACH.step + 1} / ${steps.length}</span>
          <button type="button" class="linkbtn" id="coach-skip">スキップ</button>
          ${st.wait ? '<span class="coach-do">やってみよう！</span>' : `<button type="button" class="btn primary" id="coach-next">${last ? 'わかった' : '次へ'}</button>`}
        </div></div></div>`;
  COACH.shown = COACH.step;
  $('#coach-skip').onclick = () => coachEnd(true);
  const nb = $('#coach-next'); if (nb) { nb.onclick = () => { COACH.step++; coachTick(); }; nb.focus({ preventScroll: true }); }
  menuOpen(menuMobile() && [].concat(st.el).some(sel => { const e = document.querySelector(sel); return e && e.closest('#topmenu'); }));
  coachPan(st);
  coachScroll(coachRect(st), 'smooth');
}
// keep the lit area on screen with room for the bubble below it
function coachScroll(r, behavior) {
  if (!r || !(r.top < 70 || r.bottom > innerHeight - 160)) return;
  const dy = r.height > innerHeight - 220 ? r.top - 70 : r.top + r.height / 2 - (innerHeight - 160) / 2;
  COACH.scrolledAt = Date.now();
  scrollTo({ top: scrollY + dy, behavior }); // a page position, so a scroll still running from the last step does not add up
}
// on a phone the map scrolls sideways: bring a lit thing on the map (the school, a stage, a dojo) to the middle first
function coachPan(st) {
  const box = $('#mapbox'), el = [].concat(st.el).map(sel => document.querySelector(sel)).find(e => e && e !== box && box.contains(e));
  if (!el || box.scrollWidth <= box.clientWidth) return;
  const r = el.getBoundingClientRect(), m = box.getBoundingClientRect();
  box.scrollTo({ left: box.scrollLeft + r.left + r.width / 2 - (m.left + m.width / 2) }); // at once, so it never fights the page scroll below
}
function coachPlace(r) {
  const hole = $('#coach-hole'), b = $('#coach-bubble'); if (!hole || !b) return;
  const vw = document.documentElement.clientWidth, vh = innerHeight;
  const pad = 6, bw = Math.min(360, vw - 24), bh = b.offsetHeight || 140;
  b.style.width = bw + 'px';
  if (!r) { Object.assign(hole.style, { left: '50%', top: '40%', width: '0px', height: '0px' }); Object.assign(b.style, { left: (vw - bw) / 2 + 'px', top: (innerHeight - bh) / 2 + 'px' }); return; }
  Object.assign(hole.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  let top = r.bottom + 14;
  if (top + bh > innerHeight - 8) top = r.top - bh - 14;
  if (top < 8) top = Math.max(8, innerHeight - bh - 8);
  const left = Math.min(Math.max(12, r.left), vw - bw - 12);

addEventListener('resize', () => COACH.key && coachTick());
addEventListener('scroll', () => COACH.key && coachTick(), { passive: true });
$('#mapbox').addEventListener('scroll', () => COACH.key && coachTick(), { passive: true }); // the lit area follows the map as it slides
// called after every play-screen render: start whichever tutorial this moment needs
const TUT_NAMES = { map: 'マップの見かた', L0: 'カードの入れ方（LV0）', L1: '日本語の並べかえ（LV1）', L2: '主語と動詞さがし（LV2）', L3: '英語の打ちこみ方（LV3）', L4: '箱なしの書き方（LV4）', BOSS: 'ボスステージ', expert: '手練モード', nest: 'かたまり', post: 'うしろから説明する箱', flex: '破線の箱' };

/* ---------- self-check for question data (run gojunSelfTest() in the console) ---------- */
window.gojunSelfTest = () => {
  const problems = []; let n = 0;
  for (const w of WORLDS) for (const st of w.bonus ? [...w.stages, w.bonus] : w.stages) for (const q of st.lines.filter(l => l.type === 'Q')) {
    n++;
    const cands = candidates(q).map(c => c.text);
    const model = expandC(modelSentence(q));
    if (!cands.includes(model)) problems.push(`${q.id} 模範解答が正解にならない: ${model}`);
    for (const v of variants(q.chunks)) {
      const s = expandC(compose(v.map(i => q.chunks[i].answers[0]), q));
      if (!cands.includes(s)) problems.push(`${q.id} 語順の別解が正解にならない: ${s}`);
    }
    if (['L1', 'REVIEW'].includes(st.level) && q.chunks.filter(c => !c.ja).length > 1) problems.push(`${q.id} LV1 で日本語なしの箱が2つ以上（並べかえで区別できない）`);
    const jas = q.chunks.filter(c => c.ja).map(c => c.ja);
    if (new Set(jas).size !== jas.length) problems.push(`${q.id} 同じ日本語の箱が2つある`);
    for (const c of q.chunks) if (c.answers.some(a => /[{}|]/.test(a))) problems.push(`${q.id} 答えに { } や | が残っている: ${c.answers.join(' / ')}`);
    for (const c of q.chunks) if (c.opts && !c.opts.some(o => c.answers.map(norm).includes(norm(o)))) problems.push(`${q.id} カードの選択肢に正解がない: ${c.opts.join(' / ')}`);
    if (st.level === 'L2' && !q.chunks.some(c => isFindTarget(c, 'V') && c.ja)) problems.push(`${q.id} LV2 で動詞をタップできない`);
    try { if (LANG === 'en' && !q.note && !autoNote(q)) problems.push(`${q.id} ポイントの自動説明が空`); } catch (e) { problems.push(`${q.id} ポイントの自動説明でエラー: ${e.message}`); }
  }
  for (const st of WORLDS.flatMap(w => w.stages).filter(s => s.drill)) for (let i = 0; i < 60; i++) {
    let q; try { q = drillOne(st.drill, 'test'); } catch (e) { problems.push(`${st.id} ドリルの文が作れない: ${e.message}`); break; }
    const cands = candidates(q).map(c => c.text);
    if (!cands.includes(expandC(modelSentence(q)))) problems.push(`${st.id} ドリル: 模範解答が正解にならない ${q.ja}`);
    for (const c of q.chunks) if (jaIn(c) && !q.ja.includes(jaIn(c))) problems.push(`${st.id} ドリル: 「${c.ja}」が日本文にない ${q.ja}`);
    const jas = q.chunks.filter(c => c.ja).map(c => c.ja); if (new Set(jas).size !== jas.length) problems.push(`${st.id} ドリル: 同じ日本語の箱 ${q.ja}`);
    if (q.chunks.filter(c => !c.ja).length > 1) problems.push(`${st.id} ドリル: 日本語なしの箱が2つ以上 ${q.ja}`);
  }

};
